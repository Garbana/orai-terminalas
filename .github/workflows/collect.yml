name: Rinkti matavimus

# GitHub cron šioje repozitorijoje nepatikimas (valandomis nepasileidžia), todėl rinkimas veikia grandine:
# vienas paleidimas ~5,5 val. kas 10 min. renka matavimus, o pabaigoje pats paleidžia kitą.
# Cron – tik atsarginis, jei grandinė kada nors nutrūktų (concurrency neleidžia dviejų vienu metu).
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rinkti kas 10 min.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 330 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase origin main || true
            node scripts/collect.mjs || true
            git add data/live
            if ! git diff --cached --quiet; then
              git commit -q -m "Matavimai $(date -u +'%Y-%m-%d %H:%M') UTC"
              git push -q origin HEAD:main || { git pull -q --rebase origin main && git push -q origin HEAD:main; } || true
            fi
            sleep 600
          done
      - name: Paleisti kitą grandinės paleidimą
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main -R "${{ github.repository }}"
