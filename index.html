  $("pop").innerHTML = `<div class="pophead"><h3>Orų duomenys</h3><button class="btn" id="popClose" aria-label="Uždaryti">✕</button></div>${IND.filter((d) => d.g === "w").map(row).join("")}
    <h3>Techniniai indikatoriai</h3>${IND.filter((d) => d.g === "t").map(row).join("")}`;
  $("popClose").onclick = togglePop;
  $("pop").querySelectorAll('input[type=checkbox]').forEach((el) => (el.onchange = () => { S.ind[el.dataset.id].on = el.checked; saveS(); build(); }));
  $("pop").querySelectorAll('input[type=number]').forEach((el) => (el.onchange = () => { const v = parseFloat(el.value); if (!(v > 0) && !(el.dataset.k === "h" && v === 0)) return; S.ind[el.dataset.id].p[el.dataset.k] = v; S.ind[el.dataset.id].on = true; saveS(); renderPop(); build(); }));
}
function togglePop() { const p = $("pop"); p.hidden = !p.hidden; $("indBtn").setAttribute("aria-pressed", String(!p.hidden)); $("indBtn").setAttribute("aria-expanded", String(!p.hidden)); if (!p.hidden) renderPop(); }
$("indBtn").onclick = togglePop;

$("themeBtn").onclick = () => { const root = document.documentElement; const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; build(); if (!$("pop").hidden) renderPop(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => build());


/* ---------- gyvi duomenys: data/live/<stotis>.json kas 30 min. papildo GitHub Actions (scripts/collect.mjs) ---------- */
const API = window.__API || "data/live/";
const fresh = () => "?t=" + Math.floor(Date.now() / 60000);
const LV = { on: false, timer: null, busy: false };
const SEED_LAST = RAW.t0 + (RAW.n - 1) * 3600;
function setLive(mode, text, title) { const el = $("live"); el.dataset.mode = mode; el.querySelector("span").textContent = text; el.title = title || text; }
function putRows(rows) {
  const ARR = [T, F, W, G, DIR, CL, PR, HU, RN, SN, K]; let changed = 0;
  rows.forEach((r) => {
    const i = Math.round((r[0] - RAW.t0) / 3600); if (!(i >= 0)) return;
    while (N <= i) { ARR.forEach((a) => a.push(null)); const u = RAW.t0 + N * 3600; LT.push(u + tzOff(u)); N++; changed++; }
    let code = r[11] || null; if (code) { const c = CONDS.indexOf(code); code = c >= 0 ? c : CONDS.push(code) - 1; }
    const nv = r.slice(1, 11).map((v) => (v == null ? null : +v)).concat([code]);
    ARR.forEach((a, k) => { if (a[i] !== nv[k]) { a[i] = nv[k]; changed++; } });
  });
  return changed;
}
function applyLive() {
  const r = chart && chart.timeScale().getVisibleLogicalRange(), oldLen = BARS.length;
  for (const k in cache) delete cache[k];
  I1 = N; LAST = dstr(LT[N - 1]); gi.max = LAST;
  build();
  if (r && r.to >= oldLen - 2) { const off = r.to - (oldLen - 1), w = r.to - r.from; chart.timeScale().setVisibleLogicalRange({ from: BARS.length - 1 + off - w, to: BARS.length - 1 + off }); }
}
const when = (t) => { const d = new Date(t * 1000), o = { timeZone: "Europe/Vilnius" };
  const same = d.toLocaleDateString("lt-LT", o) === new Date().toLocaleDateString("lt-LT", o);
  return (same ? "" : d.toLocaleDateString("lt-LT", Object.assign({ month: "2-digit", day: "2-digit" }, o)) + " ") + d.toLocaleTimeString("lt-LT", Object.assign({ hour: "2-digit", minute: "2-digit" }, o)); };
// tiesiai iš LHMT – naujausi 24 val.; jei naršyklė neprileidžia (CORS ar ryšys), lieka GitHub surinkti failai
const METEO = "https://api.meteo.lt/v1/stations/";
const nn = (v) => (v == null || v === "" || isNaN(+v) ? null : +v);
const obsRow = (o) => [Date.parse(o.observationTimeUtc.replace(" ", "T") + "Z") / 1000, nn(o.airTemperature), nn(o.feelsLikeTemperature),
  nn(o.windSpeed), nn(o.windGust), nn(o.windDirection), nn(o.cloudCover), nn(o.seaLevelPressure), nn(o.relativeHumidity),
  nn(o.precipitation), nn(o.snowDepth), o.conditionCode || null];
async function liveTick(first) {
  if (LV.busy) return; LV.busy = true;
  if (first && window.__STATIONS) setLive("load", "Jungiamasi…", "Ieškoma naujausių matavimų");
  try {
    // pirmą kartą – viskas po statinės istorijos; vėliau – paskutinės 6 val., kad pasigautų pataisymus
    const since = first ? SEED_LAST : RAW.t0 + (N - 1) * 3600 - 6 * 3600;
    let rows = [], updated = null, got = 0, direct = false;
    try {
      const r = await fetch(API + encodeURIComponent(ST.code) + ".json" + fresh());
      const j = r.ok ? await r.json() : null;
      if (j && Array.isArray(j.rows)) { rows = j.rows; updated = j.updated; got++; }
    } catch (e) {}
    try {
      const r = await fetch(METEO + encodeURIComponent(ST.code) + "/observations/latest", { cache: "no-store" });
      const j = r.ok ? await r.json() : null;
      if (j && Array.isArray(j.observations)) { rows = rows.concat(j.observations.map(obsRow)); got++; direct = true; }
    } catch (e) {}
    if (!got) throw new Error("duomenų šaltiniai nepasiekiami");
    const changed = putRows(rows.filter((row) => row[0] >= since));
    LV.on = true;
    if (changed || first) applyLive();
    const lastT = RAW.t0 + (N - 1) * 3600, late = Date.now() / 1000 - lastT > 3 * 3600;
    setLive(late ? "load" : "on", (late ? "Vėluoja · " : "Gyvai · ") + when(lastT),
      "Paskutinis matavimas " + when(lastT) + " Vilniaus laiku" + (direct ? " (tiesiai iš LHMT)" : "") + ". Patikrinta " + when(Date.now() / 1000) +
      ". Spustelėkite, kad atnaujintumėte." + (updated ? " GitHub rinkimas " + when(Date.parse(updated) / 1000) + "." : ""));
  } catch (e) {
    if (!LV.on) setLive("off", "Archyvas", "Gyvų duomenų šaltinis nepasiekiamas – rodomas archyvas iki " + LAST + ". Spustelėkite, kad bandytumėte dar kartą.");
    else setLive("err", "Ryšio klaida", "Nepavyko atnaujinti (" + e.message + "). Spustelėkite, kad bandytumėte dar kartą.");
  } finally { LV.busy = false; }
  if (!first) { loadFc(); if (S.ind.fcacc.on) loadAcc(); }
  clearTimeout(LV.timer); LV.timer = setTimeout(() => liveTick(false), 10 * 60 * 1000);
}
function refreshLive() { if (LV.busy) return; setLive("load", "Atnaujinama…", "Ieškoma naujausių matavimų"); liveTick(!LV.on); }
$("live").onclick = refreshLive;
$("live").onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); refreshLive(); } };
document.addEventListener("visibilitychange", () => { if (!document.hidden && LV.on) liveTick(false); });

/* ---------- stoties (tikerio) pasirinkimas ---------- */
$("symTick").textContent = ST.ticker;
$("symName").textContent = ST.name + " · oro temperatūra 2 m aukštyje";
const normS = (x) => x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
let snap = null, snapAt = 0, symSel = 0, symItems = [];
function openSym() {
  $("symDlg").hidden = false; $("symQ").value = ""; symSel = 0; renderSym(); $("symQ").focus();
  if (window.__STATIONS && Date.now() - snapAt > 5 * 60 * 1000) {
    fetch(API + "snapshot.json" + fresh()).then((r) => (r.ok ? r.json() : null)).then((j) => { if (j) { snap = j; snapAt = Date.now(); if (!$("symDlg").hidden) renderSym(); } }).catch(() => {});
  }
}
function closeSym() { $("symDlg").hidden = true; $("symBtn").focus(); }
function renderSym() {
  const q = normS($("symQ").value.trim());
  symItems = STS.filter((x) => !q || normS(x.name).includes(q) || x.ticker.toLowerCase().includes(q));
  symSel = Math.max(0, Math.min(symSel, symItems.length - 1));
  $("symList").innerHTML = symItems.map((x, k) => {
    const sp = snap && snap[x.code], live = !!(sp && sp[1] != null), t = live ? sp[1] : x.last;
    return `<button class="symrow${k === symSel ? " sel" : ""}${x.code === ST.code ? " cur" : ""}" role="option" aria-selected="${k === symSel}" data-code="${x.code}">` +
      `<b>${x.ticker}</b><span>${x.name}<small>duomenys nuo ${x.from || "–"}</small></span>` +
      `<em style="color:${t == null ? "var(--muted)" : t >= 0 ? "var(--warm)" : "var(--cool)"}" title="${live ? "Paskutinis matavimas " + when(sp[0]) : "Paskutinė archyvo reikšmė"}">${nf(t)}°</em></button>`;
  }).join("") || '<p class="dlgnote">Tokios stoties nėra.</p>';
  $("symList").querySelectorAll(".symrow").forEach((b) => (b.onclick = () => pickSym(b.dataset.code)));
  const sel = $("symList").querySelector(".sel"); if (sel) sel.scrollIntoView({ block: "nearest" });
  $("symNote").textContent = window.__STATIONS
    ? `${STS.length} LHMT automatinės stotys. Dešinėje – paskutinė išmatuota temperatūra.`
    : "Šioje versijoje įdėta tik viena stotis. Visos stotys – pilnoje svetainės versijoje.";
}
function pickSym(code) {
  if (code === ST.code) return closeSym();
  try { localStorage.setItem("vt.station", code); } catch (e) {}
  location.hash = code; location.reload();
}
$("symBtn").onclick = openSym; $("symClose").onclick = closeSym;
$("symQ").oninput = () => { symSel = 0; renderSym(); };
$("symQ").onkeydown = (e) => {
  if (e.key === "ArrowDown") { symSel = Math.min(symItems.length - 1, symSel + 1); renderSym(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { symSel = Math.max(0, symSel - 1); renderSym(); e.preventDefault(); }
  else if (e.key === "Enter" && symItems[symSel]) pickSym(symItems[symSel].code);
  else if (e.key === "Escape") closeSym();
};
$("symDlg").onclick = (e) => { if (e.target.id === "symDlg") closeSym(); };
window.addEventListener("hashchange", () => { const c = decodeURIComponent(location.hash.slice(1)); if (c && c !== ST.code && STS.some((x) => x.code === c)) location.reload(); });

renderTop(); renderRail(); build(); loop(); liveTick(true); loadFc();
}
if (window.__WX) boot();
else (async () => {
  const lg = document.getElementById("legend"); lg.textContent = "Kraunama…";
  try {
    const sr = await fetch(window.__STATIONS_URL); if (!sr.ok) throw new Error("HTTP " + sr.status);
    const st = (window.__STATIONS = await sr.json());
    let pref = null; try { pref = localStorage.getItem("vt.station"); } catch (e) {}
    const want = decodeURIComponent(location.hash.slice(1)) || pref || "vilniaus-ams";
    window.__STATION = st.find((x) => x.code === want) || st.find((x) => x.code === "vilniaus-ams") || st[0];
    lg.textContent = "Kraunama: " + window.__STATION.name + "…";
    const r = await fetch("data/st/" + window.__STATION.code + ".json?v=" + (window.__V || "")); if (!r.ok) throw new Error("HTTP " + r.status);
    window.__WX = await r.json(); boot();
  } catch (e) { lg.textContent = "Nepavyko įkelti duomenų (" + e.message + "). Perkraukite puslapį."; }
})();
</script>
